_version = 1

[workflow]
graph = "workflow.fabro"

[run.inputs]
spec = ""
base = ""
trunk = ""
approve_children = "true"
workflows_repo = "DWSR/fabro"
workflows_ref = ""

[run.agent]
fabro_tools = true

[run.integrations.github]
additional_repositories = ["DWSR/fabro"]
permissions = { contents = "write", pull_requests = "write" }

[run.run_branch]
enabled = true
push = true

[run.pull_request]
enabled = false

[run.checkpoint]
exclude_globs = [
    "**/node_modules/**",
    "**/target/**",
    "**/dist/**",
    "**/build/**",
    "**/.venv/**",
    "**/__pycache__/**",
    "**/.cache/**",
    "**/.pytest_cache/**",
]

[[run.hooks]]
name = "approve-children-post-create"
event = "post_tool_use"
matcher = "fabro_run_create"
sandbox = false
blocking = false
timeout = "15s"
script = '''
set -u

TOKEN="${FABRO_DEV_TOKEN:-}"
if [ -z "$TOKEN" ] && [ -r /run/secrets/fabro-dev-token ]; then
  TOKEN=$(cat /run/secrets/fabro-dev-token)
fi
[ -n "$TOKEN" ] || exit 0

API="${FABRO_API_BASE:-http://127.0.0.1:32276/api/v1}"
CONTEXT=$(cat)
RUN_ID=$(printf '%s' "$CONTEXT" | jq -r '.run_id // empty' 2>/dev/null)
[ -n "$RUN_ID" ] || RUN_ID="${FABRO_RUN_ID:-}"
[ -n "$RUN_ID" ] || exit 0

APPROVE=$(printf '%s' "$CONTEXT" | jq -r '.inputs.approve_children // empty' 2>/dev/null)
if [ -z "$APPROVE" ]; then
  APPROVE=$(curl -fsS --max-time 5 "$API/runs/$RUN_ID/settings" -H "Authorization: Bearer $TOKEN" 2>/dev/null | jq -r '.run.inputs.approve_children // "false"' 2>/dev/null)
fi
[ "$APPROVE" = "true" ] || exit 0

for _ in 1 2 3 4 5 6; do
  IDS=$(printf '%s' "$CONTEXT" | jq -r '(.tool_input.run_ids // [])[]' 2>/dev/null)
  if [ -z "$IDS" ]; then
    IDS=$(curl -fsS --max-time 5 "$API/runs?parent_id=$RUN_ID&status=pending" -H "Authorization: Bearer $TOKEN" 2>/dev/null | jq -r '.data[].id' 2>/dev/null)
  fi
  for id in $IDS; do
    curl -fsS --max-time 5 -o /dev/null -X POST "$API/runs/$id/approve" -H "Authorization: Bearer $TOKEN" && exit 0
  done
  sleep 1
done
exit 0
'''

[[run.hooks]]
